[project]
name = "langchain-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ansh4359", email = "anshsingh4359@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.0",
    "google-genai>=2.21.0",
    "google-search-results>=2.4.2",
    "ipykernel>=7.3.0",
    "langchain>=1.3.18",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.1",
    "langchain-google-genai>=4.3.7",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "playwright>=1.62.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.16.2",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.1",
]

[project.scripts]
langchain = "langchain:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "venv",
]

[tool.uv]
package = false
